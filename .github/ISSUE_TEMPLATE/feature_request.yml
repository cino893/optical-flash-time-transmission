name: Feature Request
description: Suggest an improvement, new capability, or UX refinement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make Optical Flash Time Transmission better? Share it below!

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve or what workflow would it improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you envision this feature working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / additional context
      description: Any alternative approaches, mockups, or references.
